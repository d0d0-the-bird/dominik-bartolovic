<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Private page</title>
<style>
  html { background: #e9eff7; color: #16244a; color-scheme: light; }
  .lock { max-width: 340px; margin: 22vh auto 0; padding: 0 20px; font: 16px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; }
  .lock h1 { font-size: 22px; margin: 0 0 6px; }
  .lock p { margin: 0 0 18px; opacity: .7; }
  .lock form { display: flex; gap: 8px; }
  .lock input { flex: 1; min-width: 0; padding: 10px 14px; font: inherit; color: inherit; background: #fff; border: 2.5px solid currentColor; border-radius: 999px; }
  .lock button { padding: 10px 18px; font: inherit; font-weight: 700; color: inherit; background: #ffcb3d; border: 2.5px solid currentColor; border-radius: 999px; box-shadow: 3px 3px 0 currentColor; cursor: pointer; }
  .lock .err { color: #c0392b; opacity: 1; margin: 12px 0 0; min-height: 1.5em; }
</style>
</head>
<body>
<div id="app"></div>
<noscript><p style="text-align:center;margin-top:20vh">This page needs JavaScript.</p></noscript>
<script>
(function () {
  var BUILD = 'f64df1ac';
  var STORE = 'site-access-code';
  var app = document.getElementById('app');
  var key = null, bundle = null, urls = {};

  function saved() { try { return localStorage.getItem(STORE); } catch (e) { return null; } }
  function save(t) { try { localStorage.setItem(STORE, t); } catch (e) {} }

  // A link looks like  …/#k=CODE  or  …/#k=CODE/project/name
  // The part after # never leaves the browser. Take the code out of the address bar at once.
  function takeCode() {
    var m = /^#k=([^\/]+)(\/.*)?$/.exec(location.hash);
    if (!m) return null;
    history.replaceState(null, '', location.pathname + location.search + '#' + (m[2] || '/'));
    return m[1];
  }

  async function makeKey(code) {
    var hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('personal-site-v1:' + code));
    return crypto.subtle.importKey('raw', hash, 'AES-GCM', false, ['decrypt']);
  }
  async function open(k, file) {
    var res = await fetch(file + '?v=' + BUILD);
    if (!res.ok) throw new Error('network');
    var data = new Uint8Array(await res.arrayBuffer());
    try {
      return await crypto.subtle.decrypt({ name: 'AES-GCM', iv: data.subarray(0, 12) }, k, data.subarray(12));
    } catch (e) { throw new Error('code'); }
  }

  async function unlock(code) {
    var k = await makeKey(code.trim());
    bundle = JSON.parse(new TextDecoder().decode(await open(k, 'site.bin')));
    key = k;
    var style = document.createElement('style');
    style.textContent = bundle.css;
    document.head.appendChild(style);
  }

  function route() {
    var h = location.hash.slice(1);
    return h.charAt(0) === '/' ? h : '/';
  }

  function render() {
    var page = bundle.pages[route()] || bundle.pages['/404'];
    document.title = page.title;
    app.innerHTML = page.html;
    window.scrollTo(0, 0);
    if (bundle.js) { try { new Function('app', bundle.js)(app); } catch (e) {} }
    app.querySelectorAll('[data-asset]').forEach(async function (el) {
      var name = el.getAttribute('data-asset'), a = bundle.assets[name];
      if (!a) return;
      if (!urls[name]) {
        urls[name] = open(key, a.file).then(function (buf) {
          if (!a.gz) return buf;
          var unpacked = new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'));
          return new Response(unpacked).arrayBuffer();
        }).then(function (buf) {
          return URL.createObjectURL(new Blob([buf], { type: a.type }));
        });
      }
      try { el[el.tagName === 'A' ? 'href' : 'src'] = await urls[name]; } catch (e) {}
    });
  }

  function lock(message) {
    document.title = 'Private page';
    app.innerHTML = '<div class="lock"><h1>Private page</h1><p>Enter the access code to continue.</p>' +
      '<form><input name="code" aria-label="Access code" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus>' +
      '<button>Open</button></form><p class="err" role="alert"></p></div>';
    app.querySelector('.err').textContent = message || '';
    app.querySelector('form').addEventListener('submit', function (e) {
      e.preventDefault();
      var code = e.target.code.value;
      if (code.trim()) start(code);
    });
  }

  async function start(code) {
    code = code || takeCode() || saved();
    if (!code) return lock();
    if (!window.crypto || !crypto.subtle) return lock('This browser cannot open the page.');
    try {
      await unlock(code);
      save(code.trim());
      render();
    } catch (e) {
      lock(e.message === 'code' ? 'That code did not work.' : 'Could not load the page. Please try again.');
    }
  }

  window.addEventListener('hashchange', function () {
    var code = takeCode();
    if (code) start(code); else if (bundle) render();
  });
  start();
})();
</script>
</body>
</html>
